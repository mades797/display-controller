repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        description: Cups trailing whitespace from the ends of lines.
      - id: end-of-file-fixer
        name: Fix End of Files
        description: Ensures that files end with a single newline and nothing else.
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.4.0
    hooks:
      - id: cppcheck
        args: ["--error-exitcode=1", "--enable=all", "--suppress=missingIncludeSystem", "-I./include"]
        files: \.cpp$
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
